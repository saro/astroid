---
name: "CI: Arch Linux"
on:
  - push
  - pull_request
jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 25
    steps:
      - name: Initialize Arch Linux keyring and update system
        run: |
          # Initialize pacman keyring
          pacman-key --init
          pacman-key --populate archlinux

          # Update system
          pacman -Syu --noconfirm --needed

          # Install git and base-devel for checkout
          pacman -S --needed --noconfirm base-devel git

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm \
            boost \
            boost-libs \
            cmake \
            gcc \
            glibmm \
            gmime3 \
            gnupg \
            gobject-introspection \
            gtkmm3 \
            libpeas \
            libsass \
            make \
            ninja \
            notmuch \
            pkgconf \
            protobuf \
            python \
            python-gobject \
            scdoc \
            vte3 \
            w3m \
            webkit2gtk \
            xorg-server-xvfb \
            xorg-xauth

      - name: "CMake: Configure"
        run: cmake -S. -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: "CMake: Build"
        run: cmake --build build --verbose

      - name: Run Tests
        env:
          HOME: /tmp/home
          LC_ALL: C.UTF-8
        run: |
          mkdir -p $HOME
          cd build
          xvfb-run ctest --output-on-failure --verbose
